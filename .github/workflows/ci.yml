name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NO_COLOR: "1"
  NODE_ENV: development

defaults:
  run:
    shell: bash

jobs:
  gatekeeper:
    name: Gatekeeper (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: cp .env.example .env

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment
        run: npm run test:setup

      - name: Verify code formatting
        run: npm run format:check

      - name: Inner verification (Typecheck & Lint)
        run: npm run agent:verify:inner

      - name: Check for dead code with Knip
        run: npm run check:deadcode

      - name: Run unit and component tests
        run: npm run test

      - name: Build production targets
        run: npm run build

      - name: Pack unpacked application
        run: npm run pack

      - name: Run E2E smoke test
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Try package on Linux
        run: npm run build:linux

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gatekeeper-failure-artifacts
          path: |
            release/
            test-results/
            playwright-report/
            *.log
          if-no-files-found: ignore
          retention-days: 7

  platform-compat:
    name: Platform Compatibility (${{ matrix.os }})
    needs: [gatekeeper]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: cp .env.example .env

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment
        run: npm run test:setup

      - name: Build production targets
        run: npm run build

      - name: Run unit and component tests
        run: npm run test:unit

      - name: Try package on macOS
        if: runner.os == 'macOS'
        run: npm run build:mac

      - name: Try package on Windows
        if: runner.os == 'Windows'
        run: npm run build:win

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-compat-failure-artifacts-${{ matrix.os }}
          path: |
            release/
            test-results/
            playwright-report/
            *.log
          if-no-files-found: ignore
          retention-days: 7
